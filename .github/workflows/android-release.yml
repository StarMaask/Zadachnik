name: Build APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK & Accept Licenses (API 36.1)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Prepare Keystore, .env & Firebase Config for CI Build
        env:
          CUSTOM_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-4226c707-0da4-4c25-89ac-248f3f255608</string>
          </resources>
          EOF
          fi

          if [ ! -f app/google-services.json ]; then
            if [ -n "$CUSTOM_GOOGLE_SERVICES_JSON" ]; then
              echo "$CUSTOM_GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "" | base64 -d > app/google-services.json
            fi
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache --stacktrace

      - name: Copy APK to release directory
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Ezhednevnik-v1.0.${{ github.run_number }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ezhednevnik-APK
          path: release-apk/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Ежедневник v1.0.${{ github.run_number }}"
          body: |
            Автоматическая сборка корпоративного приложения **«Ежедневник»** (Build #${{ github.run_number }}).
            - Прикреплённый установочный файл: `Ezhednevnik-v1.0.${{ github.run_number }}.apk`
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
